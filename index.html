<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORE Life CES — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#14201F;--ink-2:#3A4846;--mute:#66726F;--line:#E2DBCD;--line-2:#EEE9DE;
 --bg:#F5F1E8;--surface:#FFFFFF;--surface-2:#FAF8F3;
 --teal:#0E5C57;--teal-2:#0A4642;--teal-t:#DDEEEB;
 --brass:#A9792B;--brass-d:#7A5410;--brass-t:#F5EAD3;
 --ok:#1D774A;--ok-t:#DCF0E4;--warn:#8F5200;--warn-t:#FBEACB;--err:#AE2A21;--err-t:#F9DAD6;--info:#21559F;--info-t:#DDE7F6;
 --r-sm:6px;--r-md:10px;--r-lg:16px;
 --sh:0 1px 2px rgba(20,32,31,.06),0 4px 14px rgba(20,32,31,.06);
 --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans Arabic",Tahoma,sans-serif;
 --f-disp:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Naskh Arabic","Segoe UI",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font:600 26px/1.15 var(--f-disp)}h2{font:600 19px/1.2 var(--f-disp)}h3{font-size:15px}h4{font-size:13px;color:var(--ink-2)}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.mut{color:var(--mute)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}.hide{display:none!important}.mt{margin-top:14px}.mb{margin-bottom:14px}.mt0{margin-top:0}
/* toolbar */
#tb{position:sticky;top:0;z-index:50;background:var(--ink);color:#F3EEE3;padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--brass)}
#tb .brand{font:600 18px var(--f-disp);letter-spacing:.04em;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
#tb .brand i{width:26px;height:26px;border:2px solid var(--brass);border-radius:50%;display:inline-grid;place-items:center;font:700 11px var(--f-body);font-style:normal;color:var(--brass)}
#tb label{display:flex;flex-direction:column;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#B9B3A4;gap:2px}
#tb select{background:#1F2F2E;color:#fff;border:1px solid #3B4F4D;border-radius:var(--r-sm);padding:6px 8px;min-width:190px;max-width:260px}
.chip{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 10px;font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
#tb .chip{background:#26403E;border-color:#3B4F4D;color:#F3EEE3}
#crumb{padding:8px 16px;font-size:12px;color:var(--mute);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#crumb b{color:var(--ink)}#crumb .sep{opacity:.5}
#rolebar{padding:8px 16px;background:var(--teal-t);border-bottom:1px solid #BCD8D3;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#rolebar b{color:var(--teal-2)}
#simbar{background:var(--brass-t);color:var(--brass-d);padding:4px 16px;font-size:11.5px;text-align:center;border-bottom:1px solid #E7D3A9}
/* nav */
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:start;background:none;border:0;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--surface-2)}.nav.on{background:var(--teal);color:#fff}
.nav .ic{width:18px;text-align:center;opacity:.85}.nav .ct{margin-inline-start:auto;background:var(--err);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px}
.main{padding:20px 24px 60px;min-width:0;max-width:1400px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph .sub{color:var(--mute);margin-top:4px;max-width:760px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}.card h3{margin-bottom:8px}.card.tint{background:var(--surface-2)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.kpi .v{font:600 28px/1.1 var(--f-disp);margin:4px 0}.kpi .l{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.kpi .d{font-size:12px}
.up{color:var(--ok)}.dn{color:var(--err)}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--surface-2);text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}.t tr.clk{cursor:pointer}.t tr.clk:hover td{background:var(--surface-2)}
/* badges */
.bd{display:inline-block;border-radius:5px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.bd.ok{background:var(--ok-t);color:var(--ok)}.bd.warn{background:var(--warn-t);color:var(--warn)}.bd.err{background:var(--err-t);color:var(--err)}.bd.info{background:var(--info-t);color:var(--info)}.bd.teal{background:var(--teal-t);color:var(--teal-2)}.bd.brass{background:var(--brass-t);color:var(--brass-d)}
.sim{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px dashed var(--brass);color:var(--brass-d);border-radius:4px;padding:0 5px;background:var(--brass-t);vertical-align:middle}
.tr{display:none;font-size:10px;font-family:ui-monospace,Menlo,monospace;background:#EFEAFB;color:#4B3A86;border-radius:4px;padding:0 5px;margin-inline-start:4px}
body.trace .tr{display:inline-block}
.tracebox{display:none;margin-bottom:12px;background:#F2EEFB;border:1px dashed #9C8BD6;color:#3F3178;border-radius:var(--r-md);padding:8px 12px;font-size:12px}
body.trace .tracebox{display:block}
.lock{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--line-2) 6px,var(--line-2) 12px);color:var(--mute);border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:12px}
.banner{border-radius:var(--r-md);padding:10px 14px;font-size:13px;border:1px solid;margin-bottom:12px}
.banner.info{background:var(--info-t);border-color:#B8CBE8;color:#173F78}.banner.warn{background:var(--warn-t);border-color:#E7CC8F;color:#6B3D00}.banner.err{background:var(--err-t);border-color:#EBB4AE;color:#7F1D17}.banner.ok{background:var(--ok-t);border-color:#A9D6BB;color:#145A37}.banner.cond{background:#F1ECFA;border-color:#C8BBE8;color:#40306F}
/* buttons / forms */
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--teal-2)}.btn.ghost{background:transparent;color:var(--teal)}.btn.ghost:hover{background:var(--teal-t)}
.btn.danger{background:var(--err);border-color:var(--err)}.btn.brass{background:var(--brass-d);border-color:var(--brass-d)}.btn.sm{padding:3px 10px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld>label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{border:1px solid #CFC7B6;border-radius:var(--r-sm);padding:7px 10px;background:#fff;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.fld textarea{min-height:70px}.chk{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:13px}.chk input{margin-top:3px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mute);font-weight:600}.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters .inp,.filters select{width:auto;min-width:130px}
/* progress/stepper/timeline */
.bar{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal)}.bar.w>i{background:var(--brass)}.bar.e>i{background:var(--err)}
.steps{display:flex;gap:0;margin:6px 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:92px;text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:26px}
.step:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-weight:700;font-size:11px;color:var(--ink-2)}
.step:after{content:"";position:absolute;top:10px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}.step:last-child:after{display:none}
.step.done:before{background:var(--teal);color:#fff;content:"✓"}.step.done:after{background:var(--teal)}.step.cur:before{background:var(--brass);color:#fff}.step.cur{color:var(--ink);font-weight:600}
.tl{border-inline-start:2px solid var(--line);margin-inline-start:6px;padding-inline-start:14px;display:flex;flex-direction:column;gap:12px}
.tl>div{position:relative;font-size:13px}.tl>div:before{content:"";position:absolute;inset-inline-start:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff}
.tl .when{font-size:11px;color:var(--mute)}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;min-height:200px}
.kcol h4{display:flex;justify-content:space-between;margin:2px 4px 8px;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12.5px}.kcard:hover{border-color:var(--teal)}
/* modal / drawer / toast */
#ov{position:fixed;inset:0;background:rgba(20,32,31,.55);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
#ov.on{display:flex}.modal{background:#fff;border-radius:var(--r-lg);max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb2{padding:18px 20px}.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute)}
#dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100vw);background:#fff;z-index:80;box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(110%);transition:transform .2s,visibility 0s .2s;visibility:hidden;display:flex;flex-direction:column}
[dir=rtl] #dr{transform:translateX(-110%)}#dr.on{transform:none;visibility:visible;transition:transform .2s}
#dr header{padding:14px 16px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}
#dr .db{flex:1;overflow:auto;padding:14px}#dr footer{padding:10px;border-top:1px solid var(--line)}
#toasts{position:fixed;bottom:16px;inset-inline-start:16px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:10px 14px;max-width:380px;box-shadow:var(--sh);font-size:13px;border-inline-start:4px solid var(--brass)}
.toast.ok{border-color:#4CC38A}.toast.err{border-color:#FF7B70}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px}.msg.u{background:var(--teal);color:#fff;margin-inline-start:auto}.msg.a{background:var(--line-2)}
.msg .src{font-size:11px;opacity:.8;margin-top:4px;border-top:1px solid rgba(0,0,0,.1);padding-top:4px}
/* phone */
.stagewrap{padding:24px 16px 60px;display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:392px;height:800px;background:#0b1413;border-radius:46px;padding:10px;box-shadow:0 24px 60px rgba(20,32,31,.35);flex:none;position:relative}
.phone .scr{background:var(--bg);border-radius:36px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone .sb{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11.5px;font-weight:600;flex:none;background:var(--surface)}
.phone .ab{padding:8px 16px 10px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);flex:none}
.phone .ab b{font:600 16px var(--f-disp)}
.phone .body{flex:1;overflow:auto;padding:14px}
.phone .tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);flex:none;padding-bottom:6px}
.phone .tabbar button{flex:1;background:none;border:0;padding:8px 2px;font-size:10.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.phone .tabbar button.on{color:var(--teal);font-weight:700}
.phone .tabbar .ic{font-size:17px}
.phone .card{padding:12px;box-shadow:none}
.phone .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}.phone .tile .ic{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero{background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;border-radius:16px;padding:16px}
.hero .bd{background:rgba(255,255,255,.18);color:#fff}
.qr{width:150px;height:150px;margin:8px auto;background:conic-gradient(from 0deg,#000 0 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:16px 16px;border:8px solid #fff;outline:1px solid var(--line);border-radius:6px}
.side-info{max-width:380px;flex:1;min-width:280px}
.web{background:var(--bg);min-height:calc(100vh - 150px)}
.webnav{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:112px;z-index:5}
.webnav .nav{width:auto}.webnav .brand{font:600 18px var(--f-disp);margin-inline-end:14px;color:var(--teal-2)}
.webmain{max-width:1100px;margin:0 auto;padding:22px 24px 60px}
.disabled-native{opacity:.55}
.sw{position:relative;display:inline-block;width:38px;height:22px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#BFB8A8;border-radius:11px;transition:.15s;cursor:pointer}.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--teal)}.sw input:checked+span:before{transform:translateX(16px)}[dir=rtl] .sw input:checked+span:before{transform:translateX(-16px)}
.home{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;cursor:pointer;text-align:start;box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.hcard:hover{transform:translateY(-2px);border-color:var(--teal)}.hcard .k{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-d)}
.hcard h3{font:600 18px var(--f-disp);margin:6px 0}
.mini{display:flex;gap:2px;align-items:flex-end;height:70px}.mini i{flex:1;background:var(--teal);border-radius:2px 2px 0 0;opacity:.85}
.heat{display:grid;gap:3px}.heat i{height:22px;border-radius:3px;display:block}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:start}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;background:var(--mute)}.dot.ok{background:var(--ok)}.dot.warn{background:#D58A00}.dot.err{background:var(--err)}
@media (max-width:980px){.nav{white-space:nowrap;width:auto}.g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}.main{padding:16px}.webnav{top:0;position:static}#tb select{min-width:140px}}
@media print{#tb,#crumb,#rolebar{display:none}}
.phone h1{font-size:21px}.phone .ph{margin-bottom:10px}.phone .t td,.phone .t th{white-space:nowrap;padding:7px 8px;font-size:12px}.phone .grid.g2,.phone .grid.g3,.phone .grid.g4,.phone .grid.g21,.phone .grid.g12{grid-template-columns:1fr}.phone .kpi .v{font-size:22px}.phone .kan{grid-auto-columns:200px}
/* ===== v2: CMS-style additions ===== */
#tb{gap:10px 12px;padding:8px 14px}
#tb select{min-width:150px;max-width:220px}
#tb .seg{display:flex;background:#1F2F2E;border:1px solid #3B4F4D;border-radius:999px;padding:2px;align-self:flex-end}
#tb .seg button{background:transparent;border:0;color:#DCE3E0;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
#tb .seg button.on{background:var(--brass);color:#14201F}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{background:transparent;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--teal-2);color:#F3EEE3;font:700 11px var(--f-body);flex:none}
.av.lg{width:64px;height:64px;font:600 22px var(--f-disp)}
.actas{background:var(--teal-2);color:#EAF1EF;border-radius:var(--r);padding:12px 16px;margin-bottom:12px}
.actas .actname{font:600 18px var(--f-disp);margin:2px 0 6px}
.actas .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.actas .chips span{border:1px solid #4E7F7A;border-radius:999px;padding:2px 10px;font-size:11.5px}
.calbar{padding:12px 14px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 14px;font-size:12px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:6px}
.ct2{display:inline-block;min-width:18px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:9px;font-size:11px;margin-inline-start:4px;padding:0 5px}
.ct2.r{background:var(--err);color:#fff;border-color:var(--err)}
.ev{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid transparent}
.ev.gx,.lnchip.gx{background:#DDE7F6;color:#21559F;border-color:#B7C9E6}
.ev.pt,.lnchip.pt{background:#DDEEEB;color:#0A4642;border-color:#AFD3CD}
.ev.spa,.lnchip.spa{background:#F5EAD3;color:#7A5410;border-color:#E3CC9B}
.ev.nut,.lnchip.nut{background:#DCF0E4;color:#1D774A;border-color:#A9D6BD}

/* ---------- toast / modal / drawer ---------- */
function toast(msg,k=''){const el=document.createElement('div');el.className='toast '+k;el.innerHTML=msg;$('#toasts').appendChild(el);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();setTimeout(()=>el.remove(),4200)}
let _preFocus=null;
const focusFirst=(el)=>{if(!el)return;const f=el.querySelector('input,select,textarea,button,[href],[tabindex]:not([tabindex="-1"])');(f||el).focus({preventScroll:true})};
function modal(o){_preFocus=document.activeElement;S.modal=o;$('#ov').classList.add('on');$('#ov').innerHTML=`<div class="modal" role="dialog" aria-modal="true" tabindex="-1"><header><h2>${o.title}</h2><button class="x" data-act="mx" aria-label="Close">×</button></header><div class="mb2"><form id="mf" onsubmit="return false">${o.body}</form></div><footer>${o.noCancel?'':`<button class="btn ghost" data-act="mx">${t('Cancel')}</button>`}${o.ok===false?'':`<button class="btn ${o.okk||''}" data-act="mok">${o.ok||t('Confirm')}</button>`}</footer></div>`;focusFirst($('.modal'))}
function closeModal(){S.modal=null;$('#ov').classList.remove('on');$('#ov').innerHTML='';if(_preFocus&&_preFocus.focus)_preFocus.focus({preventScroll:true})}
ACT.mx=()=>closeModal();
ACT.mok=()=>{const f=$('#mf');if(f&&!f.reportValidity())return;const fd=f?Object.fromEntries(new FormData(f)):{};if(f)$$('input[type=checkbox]',f).forEach(c=>fd[c.name]=c.checked);const r=S.modal.fn?S.modal.fn(fd):true;if(r!==false)closeModal()};
const confirmM=(title,body,fn,ok,k)=>modal({title,body,fn,ok,okk:k});
const reasonM=(title,fn,extra='')=>modal({title,body:`${extra}${fld('Reason (recorded in the audit trail)','reason',{type:'textarea',req:true})}`,fn:fd=>fn(fd.reason)});
function drawer(title,body,foot){_preFocus=document.activeElement;S.drawer=1;const d=$('#dr');d.setAttribute('aria-label',typeof title==='string'?title:'Drawer');d.innerHTML=`<header><b>${title}</b><button class="x" style="color:#fff" data-act="dx" aria-label="Close">×</button></header><div class="db">${body}</div>${foot?`<footer>${foot}</footer>`:''}`;d.classList.add('on');focusFirst(d)}
ACT.dx=()=>{S.drawer=null;$('#dr').classList.remove('on');if(_preFocus&&_preFocus.focus)_preFocus.focus({preventScroll:true})};

function checkout(o){ // o:{title,items:[[name,amt]],onPaid,payer,noWallet}
 const sub=o.items.reduce((a,i)=>a+i[1],0),vat=Math.round(sub*0.15*100)/100;
 const open=(msg)=>modal({title:'Checkout — '+esc(o.title),ok:'Pay '+sar(sub+vat),body:`${msg||''}${tbl(['Item','Amount'],[...o.items.map(i=>[esc(i[0]),sar(i[1])]),['VAT (15% — tax config illustrative)',sar(vat)],['<b>Total</b>',`<b>${sar(sub+vat)}</b>`]])}
 ${fld('Payment method','method',{opts:['Card (Tap)','Card (HyperPay)',...(o.noWallet?[]:['Wallet (SAR '+(me()?me().wallet:0)+')']),'Points','Voucher','Secure payment link (send to payer)']})}
 <div class="banner cond xs">${sim('Simulated gateway')} Tap & HyperPay sit behind one payment layer (INT-03). Choose an outcome to see each path — the platform queries status before any retry and never captures twice.</div>
 ${fld('Simulate gateway outcome','outcome',{opts:['Authorised','Declined','Uncertain (timeout)']})}`,fn:fd=>{
  const ref='TXN-'+(5600+(++_id%400));
  if(fd.outcome==='Declined'){ntf('NTF-006','Payment could not be completed. You can retry or choose another method.','member','In-app / Push',{discreet:true});setTimeout(()=>open(banner('err',`Declined (${ref}). Neutral notice sent (NTF-006). No provider codes shown. Retry or change method.`)),0);return false}
  if(fd.outcome.startsWith('Uncertain')){setTimeout(()=>modal({title:'Payment status uncertain',ok:'Query status',body:banner('warn',`Gateway timed out for <span class="mono">${ref}</span>. The platform <b>queries the transaction status before any retry</b>; capture / void / refund happens once only. No receipt is sent until payment is confirmed.`),fn:()=>{setTimeout(()=>paid(fd,ref+' (status confirmed after inquiry)'),0)}}),0);return}
  paid(fd,ref)}});
 function paid(fd,ref){const inv='INV-'+(3310+(_id%90));D.pays.unshift({id:uid('P'),who:o.payer||who(),what:o.title,amt:sub+vat,m:fd.method,st:'Authorised',ref,inv:'ZATCA cleared'});D.zatca.unshift({id:inv,amt:sub+vat,st:'Cleared'});ntf('NTF-005','Receipt and invoice '+inv+' issued (ZATCA QR).','member','Email / In-app',{});audit('Payment',o.title+' '+ref+' '+fd.method);if(o.onPaid)o.onPaid(ref,inv);toast(`Payment confirmed <span class="mono">${ref}</span> · receipt + ZATCA invoice ${inv} issued`,'ok');render()}
 open();
}

/* ---------- booking engine (WF-04) ---------- */
function evalClass(c,m){
 const r={ok:true,notes:[],alts:[]};
 if(!m){r.ok=false;r.reason='Guests cannot book member classes. Eligible services for your guest account are listed under Book.';return r}
 if(m.noshow>=3||m.susp){r.ok=false;r.reason='Group-class booking suspended for 7 days after 3 no-shows within 14 days (rule RL-3). PT and Spa are not affected.';return r}
 if(c.rule==='Ladies only'&&GENDER[m.id]!=='F'){r.ok=false;r.reason='This class is ladies-only (gender-restricted class).';r.alts=['Combat Conditioning (Tue 18:00)','Mind & Mobility (Wed 07:00)'];return r}
 if(c.n.startsWith('Reformer Intermediate')){const q=QS[m.id]??0;if(q<4){r.ok=false;r.reason=`Prerequisite not met: 4 qualifying beginner Reformer sessions required — you have completed ${q}. ${4-q} more needed.`;r.alts=['Reformer Foundations (Wed 08:00)'];return r}
  r.notes.push(`Prerequisite met (${q} qualifying sessions).`);}
 const cap=c.cap-(c.machinesOut||0);if(c.machinesOut)r.notes.push(`Capacity based on operational machines: ${cap} (${c.machinesOut} out of service).`);
 if(c.booked>=cap){r.full=true;r.notes.push(`Class full — you can join the waitlist (position ${c.wait+1}). Promotion is automatic when a place opens; you will have a response window to accept.`)}
 return r}
function bookClass(id){
 const c=D.classes.find(x=>x.id===id),m=me();const e=evalClass(c,m);
 const body=`<div class="row sp"><div><b>${esc(c.n)}</b><div class="mut">${c.day} · ${c.time} · ${c.room} · Coach ${esc(c.coach)}</div></div>${badge(c.pillar,'teal')}</div>
 ${e.ok?'':banner('err',`<b>You can't book this class.</b><br>${e.reason}${e.alts.length?`<br><span class="xs">Alternatives: ${e.alts.join(' · ')}</span>`:''}`)}
 ${e.notes.map(n=>`<div class="xs mut">• ${n}</div>`).join('')}
 ${e.ok?`<div class="mt">${tbl(['Rule','Value'],[['Cancellation cut-off','3 hours before start (GX)'],['Late cancel / no-show','3 no-shows in 14 days → 7-day GX suspension'],['Entitlement','Included in membership — no credit used']])}</div>`:''}
 ${e.ok&&S.role==='family'?'<div class="xs mut mt">Shared household entitlements apply (interpretation — validate).</div>':''}`;
 modal({title:e.full?'Join waitlist':'Book class',body,ok:e.ok?(e.full?'Join waitlist':'Confirm booking'):false,noCancel:false,fn:()=>{
  if(e.full){c.wait++;D.bookings.push({id:uid('B'),m:m.id,svc:c.n,type:'GX',when:c.day+' · '+c.time,loc:c.room,st:'Waitlist #'+c.wait,cls:c.id,h:20});ntf('NTF-014','You joined the waitlist for '+c.n+'. We will offer a place if one opens.','member','Push / In-app');toast('Waitlisted — place will be offered automatically.','ok')}
  else{c.booked++;D.bookings.push({id:uid('B'),m:m.id,svc:c.n,type:'GX',when:c.day+' · '+c.time,loc:'Riyadh · '+c.room,st:'Booked',cls:c.id,h:20});ntf('NTF-011','Booking confirmed: '+c.n+' · '+c.day+' '+c.time,'member','Push / In-app / WhatsApp');ntf('NTF-012','Reminder scheduled (status revalidated at send time).','member','Push');toast('Booking committed after eligibility + availability validation · confirmation sent (NTF-011)','ok')}
  audit('Booking',(m.n)+' → '+c.n);render()}});

function aiReply(q){
 const m=me(),staff=isStaffRole(),l=q.toLowerCase();
 if(staff){
  if(/summar/.test(l))return{a:1,h:`<b>Member 360 summary (draft)</b><br>Layla Al-Harbi · ELITE · valid to 14 Mar 2027 · 2 visits this week · 6 PT credits · outstanding balance SAR 240 (permissioned) · open case: none. VIP recognition prompt on arrival.`,src:'Member 360 record M-1001 (your permissions applied)',conf:'0.97'};
  if(/draft|follow/.test(l))return{a:1,h:`<b>Draft — not sent</b><br><i>EN:</i> Hi Faisal, we've missed you at CORE. Can we help you find a time that suits your week?<br><i>AR:</i> أهلاً فيصل، افتقدناك في CORE. هل نساعدك في إيجاد وقت مناسب لجدولك؟<br><span class="xs">Consent check: WhatsApp ✓ service · marketing ✓. Human review required before sending.</span>`,src:'Approved template NTF-021 + consent record',conf:'0.9',act:[{l:'Create follow-up task',id:'draft-task'}]};
  return{a:1,h:'I can summarise records, draft messages and guide procedures. I cannot send, approve or change records.',src:'Staff Copilot policy',conf:'1.0'}}
 if(/allerg|diagnos|prescrib|medic|pregnan|surgery|injur/.test(l))return{a:1,h:`I can't give allergy, medical or nutrition advice. For allergens please ask the restaurant team directly — I won't state whether an item is safe. I can hand you to a qualified team member now.`,src:'Safety boundary: allergen & health guidance (F&B / Nutrition: Critical)',conf:'blocked',act:[{l:'Hand over to staff',id:'handoff:Safety'}]};
 if(/human|person|agent|staff|talk to/.test(l))return{a:1,h:'Connecting you with the team. I will pass a privacy-masked transcript and the reason so you don\'t have to repeat yourself.',act:[{l:'Confirm handover',id:'handoff:Requested human'}]};
 if(/cancel.*(member|subscription)|freeze|refund|delete my data/.test(l))return{a:1,h:'That is a sensitive request, so I can\'t action it myself. I\'ll route it to the Membership team with your details masked.',src:'Transactional Action Framework — sensitive requests go to staff',conf:'rule',act:[{l:'Create request for staff',id:'handoff:Sensitive membership request'}]};
 if(/complain|bad|dirty|unhappy|terrible|shower|angry/.test(l)){if(S.role==='prospect'||!m&&!isGuestRole())return{a:1,h:'I\'m sorry to hear that. Please share more via our team.',act:[{l:'Hand over to staff',id:'handoff:Complaint'}]};return{a:1,h:'I\'m sorry about that. I can open a complaint case for you now — you\'ll get a case ID and a named owner.',src:'AI Complaint Classification & Routing (Critical use case) — classification assists, owner decides',conf:'0.82',act:[{l:'Create case',id:'case:'+q}]}}
 if(/book|reserve|reformer|class/.test(l)){
  if(!m)return{a:1,h:S.role==='prospect'?'Booking is for members. I can arrange a tour — with your consent I\'ll pass your details to our sales team.':'Booking member classes isn\'t available on a guest account. I can show services open to guests.',act:S.role==='prospect'?[{l:'Arrange a tour (consent)',id:'lead'}]:[]};
  const c=D.classes.find(x=>x.n.startsWith('Reformer Intermediate'));const e=evalClass(c,m);
  if(!e.ok)return{a:1,h:`I can't book <b>${c.n}</b>: ${e.reason}${e.alts.length?'<br>Alternatives: '+e.alts.join(', '):''}`,src:'Eligibility engine (revalidated now)',conf:'rule'};
  return{a:1,h:`Here's what I'll do — please confirm:<br><b>${c.n}</b> · ${c.day} ${c.time} · ${c.room}<br>Cost: included · Cancellation: 3h before start.`,src:'Schedule & policy KB-1',conf:'0.95',act:[{l:'Confirm booking',id:'book:'+c.id,k:''},{l:'Not now',id:'none',k:'ghost'}]}}
 if(/cancel|no.?show|policy/.test(l))return{a:1,h:'Group classes can be cancelled up to <b>3 hours</b> before start; PT up to <b>12 hours</b>. Three no-shows within 14 days suspends group-class booking for 7 days.',src:'KB-1 Cancellation & no-show policy v4 (published, EN/AR)',conf:'0.96'};
 if(/price|cost|how much|fee/.test(l))return{a:1,h:'I don\'t have approved, current pricing in my knowledge sources, so I won\'t guess. A CORE advisor can share a proposal.',src:'Blocked — unsupported answer (plans catalogue pending, O15)',conf:'blocked',act:[{l:'Ask an advisor',id:'handoff:Pricing enquiry'}]};
 if(/tier|member|elite|join|tour/.test(l)){return{a:1,h:'CORE membership gives branch-specific access; <b>ELITE</b> adds access across locations and priority benefits. I can arrange a tour with a sales advisor.',src:'KB-2 Membership tiers & benefits v6',conf:'0.91',act:S.role==='prospect'?[{l:'Arrange a tour (consent)',id:'lead'}]:[]}}
 return{a:1,h:'I can\'t answer that from approved sources, so I won\'t guess. Would you like a team member to follow up?',src:'No approved source found — unsupported answer blocked',conf:'blocked',act:[{l:'Hand over to staff',id:'handoff:Unanswered question'}]}
}

function applyDecision(id,k,ok,reason){
 if(k==='comp'){const c=D.comps.find(x=>x.id===id);if(ok&&c.by===S.role){toast('No self-approval: the proposer cannot approve their own request.','err');return false}c.st=ok?'Approved':'Rejected';const cs=D.cases.find(x=>x.id===c.case);if(cs&&cs.comp){cs.comp.st=ok?'Approved & posted':'Rejected';cs.tl.push([stamp(),'Compensation '+(ok?'approved and posted':'not approved')+' ('+RB(S.role).n+')'])}if(ok)ntf('NTF-024','A recovery gesture has been issued to your account','member','In-app',{discreet:true})}
 if(k==='lc'){const x=D.lifecycle.find(y=>y.id===id);x.st=ok?'Approved':'Not approved';x.note=ok?'Approved by '+RB(S.role).n+'. Revised dates shown after official membership update.':'Neutral notice sent: '+(reason||'');if(ok&&x.type==='Freeze'){const m=mById(x.m);m.status='Frozen (from 01 Nov)'}ntf('NTF-022',x.type+' request: '+x.st,'member','Push')}
 if(k==='disc'){const l=D.leads.find(y=>y.id===id);l.disc=ok?l.disc+' — approved':null;l.discOk=ok;l.act.push([stamp(),'Discount '+(ok?'approved':'not approved')+' by '+RB(S.role).n])}
 if(k==='cat'){const c=D.catering.find(y=>y.id===id);c.st=ok?'Approved — payment window open':'Declined';ntf('NTF-011','Catering request '+(ok?'approved — payment window open':'update'),'member','Push')}
 audit('Approval '+(ok?'granted':'declined'),k+' '+id,reason);toast(ok?'Approved & audited':'Declined — neutral notice sent','ok');render()}

 if(p==='experiences')return`<section class="ssec"><h1>Experiences</h1><p class="mut">Public content only. Booking requires a membership or a guest account created through a member invitation — there is no separate public guest booking portal.</p><div class="grid g2">${[['Group exercise','Six pillars; timetable preview and level guidance.','Members'],['Personal training & Reformer','Performance Coaches; packages and private sessions.','Members'],['Spa & Recovery','Treatments by qualified therapists; forms completed digitally before your visit.','Members · guests'],['Nutrition','Consultation and meal-plan programmes.','Members'],['The Terrace — dining','Tables, delivery and catering requests.','Members · dining guests'],['Sunset Yacht Experience','Request-and-approval model; members, guests and possibly non-members. Location unconfirmed (CL-09).','Request & approval']].map(x=>`<div class="card"><div class="row sp"><h3>${x[0]}</h3>${badge(x[2],'teal')}</div><div class="xs mut mt">${x[1]}</div><div class="mt">${btn('Ask about this','sitenq',{sm:true,k:'ghost'})}${x[0].includes('Yacht')||x[0].includes('Spa')?btn('Request as a guest','siteguest',{sm:true}):''}</div></div>`).join('')}</div></section>`;
 if(p==='events')return`<section class="ssec"><h1>Events</h1><p class="mut">Paid and free events with ticket limits and guest rules. ${sim('Illustrative events')}</p>${[['Sunset Yacht Social','Fri 23 Oct · Riyadh','Invited guests','SAR 450 (illustrative)'],['Pilates Masterclass','Sat 24 Oct · 10:00','Members + 1 guest','Free'],['Nutrition Workshop','Thu 29 Oct · 18:30','Open registration','SAR 80 (illustrative)']].map(e=>`<div class="card mb"><div class="row sp"><div><h3>${e[0]}</h3><div class="xs mut">${e[1]} · ${e[2]} · ${e[3]}</div></div><div class="row">${btn('Register as a guest','siteguest',{sm:true})}${btn('Ask about this','sitenq',{sm:true,k:'ghost'})}</div></div></div>`).join('')}</section>`;
 if(p==='visit'){const slots=['Tue 20 Oct 17:00','Wed 21 Oct 12:00','Thu 22 Oct 18:30','Sat 24 Oct 11:00'];return`<section class="ssec"><h1>Visit & tour</h1><p class="mut">See the club with an advisor. Choose a time — your details come next.</p><div class="grid g2"><div class="card"><h3>Choose a slot</h3><div class="slots mt">${slots.map(x=>`<button class="slot ${s.enq.d.tour===x?'on':''}" data-act="sitetour" data-id="${x}">${x}</button>`).join('')}</div><div class="fld mt"><label>Club</label><select data-chg="siteloc"><option>CORE Riyadh</option><option>CORE Jeddah</option></select></div><div class="mt">${btn('Continue with this slot','sitenq',{k:'pri'})}</div></div><div class="card"><h3>What to expect</h3><ul class="plan"><li>A 45-minute guided walk-through (illustrative)</li><li>Time to discuss goals with an advisor</li><li>A proposal if you decide to join</li></ul></div></div></section>`}
 if(p==='enquire')return siteEnq();
 if(p==='signin')return`<section class="ssec"><h1>Sign in</h1><div class="grid g2"><div class="card"><h3>Member</h3><div class="xs mut">Mobile number + one-time code.</div><form id="sif" onsubmit="return false">${fld('Mobile number','p',{val:'+966 5• ••• 4821'})}${fld('One-time code','otp',{ph:'123456',req:true,help:sim()+' use 123456'})}<button class="btn pri" data-act="sitelogin">Sign in</button></form></div><div class="card"><h3>I was invited as a guest</h3><div class="xs mut">Guests use the same website and App through a member invitation — purpose-limited and time-bound access.</div><form id="sgf" onsubmit="return false">${fld('Invitation code','c',{val:'CORE-GUEST-7Q2',req:true})}<button class="btn" data-act="siteguest">Continue as a guest</button></form></div></div></section>`;
 return''}
function siteTiers(){return['CORE','ELITE'].map(k=>`<div class="card"><div class="row sp"><h3>${k==='ELITE'?'<span class="tier elite">ELITE</span>':'<span class="tier">CORE</span>'}</h3>${badge('Inclusions pending','warn')}</div><ul class="plan">${PLANS2[k].map(x=>`<li>${x}</li>`).join('')}</ul><div class="row">${btn('Enquire about '+k,'sitenq',{id:k,sm:true})}</div></div>`).join('')}
function siteEnq(){const e=SS().enq,d=e.d;const labs=['Your details','Your interests','Tour & consent','Confirmation'];
 let b='';
 if(e.step===0)b=`<form id="ef" onsubmit="return false">${fld('Full name','name',{req:true,val:d.name||''})}${fld('Mobile number','phone',{req:true,ph:'+966 5…',val:d.phone||'+966 5• ••• 3300'})}${fld('Email','email',{type:'email',val:d.email||''})}${fld('Preferred language','lang',{opts:['English','العربية'],val:d.lang||'English'})}<div class="xs mut">We search for an existing profile before creating one — try the same mobile twice to see the merge queue.</div></form>`;
 if(e.step===1)b=`<form id="ef" onsubmit="return false"><div class="fld"><label>I am interested in</label>${['Membership — CORE','Membership — ELITE','Corporate membership (conditional)','Spa & Recovery','Nutrition','Yacht experience (request & approval)'].map(x=>`<label class="opt ${d.int===x?'on':''}"><input type="radio" name="int" value="${x}" ${d.int===x||(!d.int&&x==='Membership — CORE')?'checked':''}> ${x}</label>`).join('')}</div>${fld('Goals or questions (optional)','goals',{type:'textarea',val:d.goals||''})}</form>`;
 if(e.step===2)b=`<form id="ef" onsubmit="return false">${fld('Preferred tour time','tour',{opts:['Tue 20 Oct 17:00','Wed 21 Oct 12:00','Thu 22 Oct 18:30','Sat 24 Oct 11:00'],val:d.tour||'Tue 20 Oct 17:00'})}${fld('Club','club',{opts:['CORE Riyadh','CORE Jeddah'],val:d.club||'CORE Riyadh'})}${chk('c_service','I agree to be contacted about my enquiry (service consent)',true)}${chk('c_mkt','I agree to receive offers by WhatsApp / email (marketing consent — optional, separate)',false)}<div class="xs mut">Consent is recorded per purpose and channel and can be changed at any time.</div></form>`;
 if(e.step===3)b=`<div class="banner ok"><b>${e.dup?'We already know you.':'Thank you, '+esc(d.name)+'.'}</b> ${e.dup?'Your enquiry was added to your existing profile — no second profile was created.':'Your enquiry <b>'+e.ref+'</b> has been received.'}</div>${tl([['Now','Enquiry received — confirmation sent (NTF-001)'],['Within 4 hours (illustrative)','Auto-assigned to an advisor in '+esc(d.club||'Riyadh')],['Next','Advisor contacts you; tour '+esc(d.tour||'')+' confirmed'],['After the tour','Proposal and joining steps']])}<div class="card mt"><b>Behind the scenes (prototype handoff)</b><div class="xs mut">The lead now exists in the CRM. Continue the journey as the salesperson.</div><div class="row mt">${btn('Open the lead as Sales / CRM Staff','siteasales',{k:'pri',sm:true})}${btn('Back to the website','sitego',{id:'home',sm:true,k:'ghost'})}${btn('Start another enquiry','sitenq2',{sm:true,k:'ghost'})}</div></div>`;
 return`<section class="ssec" style="max-width:720px"><h1>Enquire</h1>${steps(labs,e.step)}<div class="card mt">${b}</div>${e.step<3?`<div class="row mt sp">${e.step>0?btn('Back','siteback'):'<span></span>'}${btn(e.step===2?'Submit enquiry':'Continue','sitenext',{k:'pri'})}</div>`:''}</section>`}
function siteEnqRead(){const f=$('#ef');if(!f)return true;if(!f.reportValidity())return false;const fd=Object.fromEntries(new FormData(f));const e=SS().enq;Object.assign(e.d,fd);if(f.c_service){e.d.c_service=f.c_service.checked;e.d.c_mkt=f.c_mkt.checked}return true}
ACT.sitenq=el=>{const s=SS();s.page='enquire';if(el&&el.dataset&&el.dataset.id&&/CORE|ELITE/.test(el.dataset.id))s.enq.d.int='Membership — '+el.dataset.id;if(s.enq.step===3)s.enq={step:0,d:{},ref:null,dup:false};window.scrollTo(0,0);render()};
ACT.sitenq2=()=>{SS().enq={step:0,d:{},ref:null,dup:false};render()};
ACT.siteback=()=>{SS().enq.step--;render()};
ACT.sitetour=el=>{SS().enq.d.tour=el.dataset.id;render()};
CHG.siteloc=el=>{SS().enq.d.club=el.value};
ACT.sitenext=()=>{if(!siteEnqRead())return;const e=SS().enq;
 if(e.step<2){e.step++;render();return}
 const d=e.d;if(!d.c_service){toast('Service consent is needed so we can contact you','err');return}
 const dup=D.leads.find(l=>l.phone===d.phone);
 if(dup){D.dupq.unshift({id:uid('DUP'),a:d.name+' (web form)',b:dup.n+' ('+dup.id+')',why:'Same mobile',status:'Held'});e.dup=true;ntf('NTF-001','Thanks — a CORE advisor will contact you within the response target.','member','Email / WhatsApp');toast('Existing profile found — added to the merge queue; no second profile created.','ok')}
 else{const L={id:uid('L'),n:d.name,src:'Website',camp:'Public website',stage:'New lead',owner:'Auto-assigned: Hessa Fahad ('+(d.club||'CORE Riyadh').replace('CORE ','')+')',loc:(d.club||'CORE Riyadh').replace('CORE ',''),pri:'High',due:'Respond in 4h',phone:d.phone,email:d.email||'—',consent:!!d.c_service,mkt:!!d.c_mkt,next:'',act:[[stamp(),'Website enquiry: interest '+(d.int||'Membership — CORE')+'; tour '+d.tour+(d.goals?'; goals: '+d.goals:'')+'. Consent captured (service'+(d.c_mkt?' + marketing':' only')+').']]};
  D.leads.unshift(L);e.ref=L.id;e.leadId=L.id;ntf('NTF-001','Next steps for your enquiry: tour '+d.tour,'member','Email / WhatsApp');ntf('NTF-001','New lead '+L.id+' assigned to you ('+d.name+')','staff:Sales','In-app / web push');toast('Lead <b>'+L.id+'</b> created in the CRM and auto-assigned.','ok')}
 e.step=3;render();window.scrollTo(0,0)};
ACT.siteasales=()=>{const e=SS().enq;S.role='sales';S.iface='crm';S.tab={};S.f={};S.params=e.leadId?{lid:e.leadId}:{};S.view='leads';render();window.scrollTo(0,0)};
ACT.sitelogin=()=>{const f=$('#sif');if(!f.reportValidity())return;const fd=Object.fromEntries(new FormData(f));if(fd.otp!=='123456'){toast('Incorrect code — use 123456 (simulated)','err');return}S.role='member';S.iface='web';S.view=null;S.site=null;toast('Signed in as a member (simulated)','ok');render();window.scrollTo(0,0)};
ACT.siteguest=()=>{S.role='guest';S.iface='guest';S.guestStep=0;S.g=null;S.view=null;toast('Invitation accepted — guest journey started (WF-06A)','ok');render();window.scrollTo(0,0)};
function renderSite(){const s=SS();const p=s.page;
 return`<div class="site"><header class="snav"><span class="brand" data-act="sitego" data-id="home">CORE Life</span><nav>${SITE_PAGES.map(x=>`<button class="${p===x[0]?'on':''}" data-act="sitego" data-id="${x[0]}">${x[1]}</button>`).join('')}</nav><div class="row"><button class="btn sm ghost" data-act="sitego" data-id="signin">Sign in</button><button class="btn sm pri" data-act="sitenq">Enquire</button></div></header>
 <div class="banner info xs" style="margin:0;border-radius:0">Public website — part of the Member / Prospect Web. Guests continue through a member invitation; there is no separate public guest booking portal. ${sim('Marketing copy and prices are illustrative')}</div>
 ${siteBody(p)}
 <footer class="sfoot"><div><b>CORE Life</b><div class="xs">CORE Riyadh · CORE Jeddah</div></div><div class="xs">Brand identity pending CORE guidelines · Privacy: consent captured per purpose and channel</div><button class="btn sm" data-act="dai">✦ Ask CORE (assistant)</button></footer></div>`}

/* ===== v6: CMS shell in the v1.3 format — banner, dark sidebar with brand block, topbar with title + selectors ===== */
const topTitle=()=>{if(S.iface==='home')return['Demo Home','Choose an interface or start as a persona'];if(S.iface==='scope')return['Scope & Traceability','Proposal modules, workflows and open items'];if(S.iface==='mods')return['Modules & Flows','All 19 proposal modules'];if(S.iface==='app')return['CORE App (Member)','Native member App — shown as a phone'];if(S.iface==='web')return['Member / Prospect Web','Website, enquiry and member web'];if(S.iface==='guest')return['Guest / Non-member Journey','Guest account on the member web and App'];const v=curView();return[(SCR[v]&&SCR[v].t)||t(IFACES[S.iface].n),t(IFACES[S.iface].n)]};
S.sg=S.sg||{};
function sideHtml(){const I=IFACES[S.iface];const shell=['crm','staff','mgmt','admin'].includes(S.iface);
 const on=(k)=>S.iface===k?' on':'';let h=`<div class="sbrand" data-act="home" title="Demo Home"><i>C</i><div><b>CORE</b><span>LIFE CES · MANAGEMENT SYSTEM</span></div></div>`;
 if(shell){ensureRole(S.iface);const v=curView();const items=navItems();const groups=[];let g={sec:null,its:[]};groups.push(g);items.forEach(n=>{if(n.sec){g={sec:n.sec,its:[]};groups.push(g)}else g.its.push(n)});
  const item=n=>`<button class="nav ${n.id===v?'on':''}" data-act="nav" data-id="${n.id}"><span class="ic">${n.ic||'•'}</span><span class="nt">${t(n.l)}</span>${n.ct?`<span class="ct">${typeof n.ct==='function'?n.ct():n.ct}</span>`:''}</button>`;
  h+=`<h5>${t(I.n)}</h5>`;
  groups.forEach(g=>{if(!g.its.length)return;if(!g.sec){h+=g.its.map(item).join('');return}
   const has=g.its.some(n=>n.id===v);const open=has||S.sg[g.sec]===1||S.sg.__all;const lab=g.sec.replace(/^M(\d+) · /,'<em>$1</em>');
   h+=`<button class="grp${open?' open':''}${has?' act':''}" data-act="sgrp" data-id="${esc(g.sec)}"><span>${lab}</span><u>${g.its.length}</u><i>›</i></button>`+(open?`<div class="gitems">${g.its.map(item).join('')}</div>`:'')});
  if(S.iface==='staff')h+=`<button class="nav" data-act="staffview"><span class="ic">📱</span>${S.staffMobile?'Desktop view':'Mobile PWA view'}</button>`}
 else h+=`<h5>${t(I.n)}</h5><p class="sbnote">Use the interface switcher above to move between the seven interfaces.</p>`;
 h+=`<div class="sbtools"><button class="grp${S.sg.__tools?' open':''}" data-act="sgrp" data-id="__tools"><span>Prototype tools</span><i>›</i></button>`+(S.sg.__tools?`<div class="gitems"><button class="nav${on('scope')}" data-act="scope"><span class="ic">⚑</span>${t('Scope & Traceability')}</button><button class="nav" data-act="guide"><span class="ic">▶</span>Guided journeys</button><button class="nav${S.trace?' on':''}" data-act="trace"><span class="ic">◌</span>${t('Trace')} overlay</button></div>`:'')+`</div>`;
 h+=`<div class="sbfoot">Clickable prototype · fictional data<br>Provisional identity pending CORE brand guidelines</div>`;return h}
ACT.sgrp=el=>{const k=el.dataset.id;S.sg[k]=S.sg[k]===1?0:1;render()};
ACT.chan=el=>CHG.iface({value:el.dataset.id});
/* ---------- render ---------- */
function render(){
 const sy=window.scrollY;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.body.classList.toggle('trace',S.trace);document.body.classList.remove('sbopen');
 const r=RB(S.role),I=IFACES[S.iface];const tt=topTitle();
 $('#sb').innerHTML=sideHtml();
 $('#tb').innerHTML=`<button class="iconbtn only-mobile" data-act="menu" aria-label="Menu">☰</button><div class="tbt"><div class="tb-title">${esc(tt[0])}</div><div class="tb-sub">${esc(LOCN(S.loc))} · ${esc(S.lang==='ar'?r.ar:r.n)}</div></div><div class="tb-spacer"></div>
 <label class="pill" title="Switch User Interface"><span class="pi">⧉</span><select data-chg="iface" aria-label="Switch User Interface">${S.iface==='home'?`<option value="home" selected>${t('Demo Home')}</option>`:''}${S.iface==='scope'?`<option value="scope" selected>${t('Scope & Traceability')}</option>`:''}${S.iface==='mods'?`<option value="mods" selected>${t('Modules & Flows')}</option>`:''}${IFORDER.map(k=>`<option value="${k}" ${S.iface===k?'selected':''}>${t(IFACES[k].n)}</option>`).join('')}</select></label>
 <label class="pill" title="Switch User Role / Persona"><span class="pi">👤</span><select data-chg="role" aria-label="Switch User Role">${GROUPS.map(g=>`<optgroup label="${g}">${ROLES.filter(x=>x.g===g).map(x=>`<option value="${x.id}" ${S.role===x.id?'selected':''}>${S.lang==='ar'?x.ar:x.n}${x.flag?' ('+x.flag.split(' ')[0]+')':''}</option>`).join('')}</optgroup>`).join('')}</select></label>
 <label class="pill hide-sm" title="Location"><span class="pi">📍</span><select data-chg="loc" aria-label="Location">${(window.LOCS||[]).map(l=>`<option value="${l[0]}" ${S.loc===l[0]?'selected':''}>${l[1]}${l[2]?'':' — unconfirmed'}</option>`).join('')}</select></label>
 <div class="seg hide-sm" title="Responsive preview">${[['desktop','🖥'],['tablet','▢'],['mobile','▯']].map(d=>`<button class="${S.device===d[0]?'on':''}" data-act="device" data-id="${d[0]}" aria-label="${d[0]} preview">${d[1]}</button>`).join('')}</div>
 <div class="seg"><button class="${S.lang==='en'?'on':''}" data-act="lang" data-id="en">EN</button><button class="${S.lang==='ar'?'on':''}" data-act="lang" data-id="ar">ع</button></div>
 <button class="iconbtn" data-act="drn" title="Notification Centre — shared service">🔔<span class="dot" id="nbadge">0</span></button><button class="iconbtn" data-act="dai" title="Personal AI assistant — shared across App, web and approved messaging">✦</button><button class="iconbtn" data-act="reset" title="Reset Demo Data">↺</button>`;
 const rb=$('#rolebar');
 if(['home','scope','mods'].includes(S.iface)){rb.classList.add('hide')}else{rb.classList.remove('hide');rb.innerHTML=`${S.modFrom?`<button class="btn sm" data-act="modopen" data-id="${S.modFrom}">‹ Module ${pad(S.modFrom)} flow</button>`:''}<span class="chip">${t('Interface')}: <b>${t(I.n)}</b></span><b>${S.lang==='ar'?r.ar:r.n}</b><span>— ${esc(r.purpose)}</span>${r.flag?badge(r.flag,'brass'):''}<span class="chip">Scope: ${esc(roleScope(r))}</span>`}
 $('#simbar').innerHTML='<span class="dl"></span><b>PROTOTYPE</b> · UX validation only · fictional sample data · not production software · business rules shown are proposal defaults (O16)';
 document.body.dataset.device=S.device||'desktop';const stage=$('#stage');
 try{
  if(S.iface==='home')stage.innerHTML=renderHome();else if(S.iface==='scope')stage.innerHTML=renderScope();else if(S.iface==='mods')stage.innerHTML=renderMods();
  else if(S.iface==='app')stage.innerHTML=renderApp();else if(S.iface==='web')stage.innerHTML=renderWeb();else if(S.iface==='guest')stage.innerHTML=renderGuest();else stage.innerHTML=renderShell();
 }catch(e){console.error(e);stage.innerHTML=`<div class="main"><div class="banner err"><b>Something didn't load correctly.</b><p>This screen hit an unexpected error. You can return to the dashboard and try again.</p><button class="btn pri sm mt" data-act="home">← Back to dashboard</button><details class="xs mut mt"><summary>Technical details (for internal use)</summary><pre>${esc(e.stack||e.message)}</pre></details></div></div>`}
 refreshBadges();window.scrollTo(0,sy)}
function renderShell(){ensureRole(S.iface);const items=navItems();const v=curView();const sc=SCR[v];const r=RB(S.role);
 const body=sc?sc.f({role:r,params:S.params}):`<div class="banner warn">No screen for ${esc(v)}</div>`;
 if(S.iface==='staff'&&S.staffMobile)return`<div class="stagewrap">${phone('staff',body,items.filter(n=>!n.sec).slice(0,4),v)}<div class="side-info">${card('Staff PWA — mobile view',`<p>Role-based PWA view with web push. There is <b>no native staff app</b> (excluded in §12).</p><p class="mut">${esc(r.purpose)}</p>`)}</div></div>`;
 return`<main class="main" id="main">${body}</main>`};
ACT.menu=()=>document.body.classList.toggle('sbopen');


</script>
